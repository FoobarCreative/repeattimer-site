# Feature List                            Edit, add or remove features to be presented.
features                                  :
  - title                                 : Simple Configuration
    description                           : Easily set up your timer with duration and repeat count. Leave the app open to see the countdown, or close it and receive notifications for each repetition.
    fontawesome_icon_name                 : cog

  - title                                 : Home & Lock Screen Widgets
    description                           : Access your timers directly from your Home Screen or Lock Screen with convenient widgets that show your active timers.
    fontawesome_icon_name                 : mobile-screen

  - title                                 : Siri & Shortcuts Support
    description                           : Control your timers using Siri voice commands or create custom shortcuts for your favorite timer configurations.
    fontawesome_icon_name                 : robot

  - title                                 : Quick Entry Options
    description                           : Start timers quickly with common preset options, perfect for when you need to time something in a hurry.
    fontawesome_icon_name                 : bolt

  - title                                 : Background Notifications
    description                           : Receive notifications for each timer repetition, even when the app is closed, so you can continue with other tasks.
    fontawesome_icon_name                 : bell

  - title                                 : Apple Watch Support
    description                           : Full Apple Watch companion app with dynamic complications, letting you control timers right from your wrist.
    fontawesome_icon_name                 : hand-sparkles

  - title                                 : Perfect for Cooking
    description                           : Set timers to remind you when to turn food, check doneness, or move to the next cooking step.
    fontawesome_icon_name                 : utensils

  - title                                 : Work & Study Breaks
    description                           : Stay productive with planned breaks. Get reminders to stand, stretch, or take your eyes off the screen.
    fontawesome_icon_name                 : briefcase

  - title                                 : Health & Wellness
    description                           : Stay hydrated and active with regular reminders to drink water or take short exercise breaks.
    fontawesome_icon_name                 : heart

  - title                                 : Plant Care
    description                           : Keep your plants healthy with regular watering reminders, perfect for maintaining consistent care schedules.
    fontawesome_icon_name                 : leaf

  - title                                 : Screen Time Management
    description                           : Reduce eye strain with regular reminders to look away from your screen and take short breaks.
    fontawesome_icon_name                 : desktop

  - title                                 : Customizable Alerts
    description                           : Choose from different notification sounds and customize how you want to be reminded.
    fontawesome_icon_name                 : volume-high

